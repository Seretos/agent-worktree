name: dispatch-to-marketplace

# Manual recovery tool. The normal release flow (release.yml) dispatches to
# the marketplace itself. Use this only when:
#   - The marketplace dispatch step in release.yml failed and you want to
#     retry without re-running the whole build.
#   - You need to re-publish an existing release to the marketplace (e.g.
#     after the marketplace.json schema changed).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to dispatch (e.g. agent-worktree--v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          # Tag format: <plugin-name>--v<version>. Strip everything up to and including "--v".
          VERSION="${TAG##*--v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      # `ref: release` (above) deliberately has no `.github/` tree at all,
      # so it cannot reach `.github/scripts/marketplace-payload.sh` on its
      # own. Sparse-checkout just that directory from `main`, landed at its
      # own `path:` so it doesn't clobber the release-branch checkout above.
      - name: Checkout main's scripts
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          path: .ci-scripts

      - name: Verify plugin.json version matches tag
        shell: bash
        run: |
          PJ_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PJ_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::plugin.json on release branch is v$PJ_VERSION, but you asked to dispatch v$TAG_VERSION."
            echo "Re-run release.yml with version=$TAG_VERSION (or re-check the release branch state)."
            exit 1
          fi

      # Payload building is delegated to the shared
      # .github/scripts/marketplace-payload.sh (ticket #184) -- invoked via
      # `bash <path>`, never relying on the exec bit, reached via the
      # sparse `.ci-scripts` checkout above (`ref: release`, this
      # workflow's other checkout, carries no `.github/` tree at all).
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_PAT:             ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          REPO:               ${{ github.repository }}
          VERSION:            ${{ steps.tag.outputs.version }}
          TAG:                ${{ steps.tag.outputs.tag }}
          PLUGIN_JSON:        .claude-plugin/plugin.json
          MAX_CHANGELOG_LEN:  "30000"
          SCRIPTS:            .ci-scripts/.github/scripts
        run: |
          bash "$SCRIPTS/marketplace-payload.sh" | curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Seretos/agent-marketplace/dispatches \
            -d @-
