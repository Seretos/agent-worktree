name: release

# Multi-OS release pipeline (OS_TARGETS = [windows, linux]).
#
# Shape: Stamp -> Matrix-Build (one job per OS) -> Assembly.
#   1. stamp:   one-shot Linux runner stamps version into pyproject.toml +
#               plugin.json and uploads them as an artifact so every build
#               job pulls the same stamped sources.
#   2. build:   matrix job; one runner per OS. Each runs scripts/build.ps1
#               (cross-platform pwsh) and uploads its bin/ tree as an
#               OS-tagged artifact.
#   3. assemble: Linux runner downloads all per-OS bins, merges them into a
#               single staging tree, builds the release zip, force-pushes
#               the orphan `release` branch, creates the GitHub Release,
#               and dispatches to the marketplace.
#
# plugin.json uses an extensionless `command: ${CLAUDE_PLUGIN_ROOT}/bin/worktree`
# — the host OS auto-resolves to `worktree.exe` on Windows and `worktree`
# on Linux, so a single zip serves both platforms.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1. Stamp version + share the stamped source tree.
  # ------------------------------------------------------------------
  stamp:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      plugin_name: ${{ steps.meta.outputs.plugin_name }}
      tag:         ${{ steps.meta.outputs.tag }}
      prev_tag:    ${{ steps.preflight.outputs.prev_tag }}
    steps:
      # Checkout moved ahead of "Validate version is semver" (below) so that
      # step can delegate to `.github/scripts/prev-release-tag.sh
      # --check-version`, which needs the script to exist in the workspace.
      # Checkout itself has no side effect (a read-only clone), so this
      # keeps validation -- and every check after it -- ahead of every
      # side-effecting step in the pipeline.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # Strict semver grammar, shared with the `src/` marker-tag
          # ordering logic (ticket #184) -- replaces the looser inline
          # regex this step used to carry (it accepted leading zeros like
          # "01.2.3", which prev-release-tag.sh's ordering does not).
          if ! bash .github/scripts/prev-release-tag.sh --check-version "$V"; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE], no leading zeros, no build metadata)."
            exit 1
          fi

      - name: Fail if tag already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

      # Ticket #184: the orphan `release` branch/tag has no merge-base with
      # any prior commit, so notes generated directly against it are always
      # empty. The fix runs notes generation against a parallel lightweight
      # `src/<TAG>` tag (pointing at this run's real commit on `main`,
      # pushed unconditionally in the "Push orphan release branch..." step
      # below) instead. That push is only safe when this run's HEAD really
      # is `main`'s current tip (see check (a) below) -- otherwise the
      # workflow-modification guard on a `GITHUB_TOKEN` push would reject
      # it. All four pre-flight checks run here, before any side effect
      # (stamping, building, pushing) happens.
      - name: Pre-flight src/ marker tags
        id: preflight
        shell: bash
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          REPO:       ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          bash .github/scripts/preflight-src-tags.sh "$TAG"

      - name: Stamp version into pyproject.toml + plugin manifests
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # pyproject.toml
          sed -i -E "0,/^version[[:space:]]*=[[:space:]]*\"[^\"]*\"/s//version = \"$V\"/" pyproject.toml
          # Both plugin manifests get the same version.
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            tmp=$(mktemp)
            jq --arg v "$V" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          echo "Stamped version $V"
          grep '^version' pyproject.toml
          grep '"version"' .claude-plugin/plugin.json
          grep '"version"' .codex-plugin/plugin.json

      - name: Export plugin metadata
        id: meta
        shell: bash
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          echo "plugin_name=${PLUGIN_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                 >> "$GITHUB_OUTPUT"

      - name: Upload stamped source tree
        uses: actions/upload-artifact@v4
        with:
          name: stamped-source
          # v4 excludes dotfiles/dotdirs by default; the build job needs
          # .claude-plugin/ (and .github/, .gitattributes etc.) in the
          # downloaded tree to run scripts/build.ps1 -Package.
          include-hidden-files: true
          path: |
            .
            !.git
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # 2. Matrix build — one binary per OS, each uploaded as an artifact.
  # ------------------------------------------------------------------
  build:
    needs: stamp
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Download stamped source
        uses: actions/download-artifact@v4
        with:
          name: stamped-source

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Build binary + stage payload (${{ matrix.target }})
        shell: pwsh
        run: ./scripts/build.ps1 -Clean -Package

      - name: Upload OS-tagged bin payload
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bin/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # 3. Assembly — merge per-OS binaries, push release branch, publish.
  # ------------------------------------------------------------------
  assemble:
    needs: [stamp, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for orphan branch push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download stamped source
        uses: actions/download-artifact@v4
        with:
          name: stamped-source
          path: stamped/

      - name: Download all per-OS bins
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins/
          merge-multiple: false

      - name: Build merged staging tree
        id: stage
        shell: bash
        run: |
          STAGE="build/stage/agent-worktree"
          mkdir -p "$STAGE"

          # Copy the install-ready, non-binary parts from the stamped tree.
          cp -a stamped/.claude-plugin "$STAGE/"
          [ -d stamped/.codex-plugin ] && cp -a stamped/.codex-plugin "$STAGE/" || true
          [ -f stamped/.mcp.json     ] && cp -a stamped/.mcp.json     "$STAGE/" || true
          [ -f stamped/README.md       ] && cp -a stamped/README.md       "$STAGE/" || true
          [ -f stamped/LICENSE         ] && cp -a stamped/LICENSE         "$STAGE/" || true
          [ -f stamped/description.md  ] && cp -a stamped/description.md  "$STAGE/" || true
          if [ -d stamped/skills ]; then
            cp -a stamped/skills "$STAGE/"
          fi
          [ -d stamped/assets ] && cp -a stamped/assets "$STAGE/" || true

          # Merge every per-OS bin payload. Both jobs upload to bins/bin-<os>/
          # which contains a `worktree` or `worktree.exe`.
          mkdir -p "$STAGE/bin"
          shopt -s nullglob
          for d in bins/bin-*/; do
            echo "Merging $d -> $STAGE/bin/"
            cp -a "$d"/* "$STAGE/bin/"
          done

          echo "=== merged bin/ ==="
          ls -la "$STAGE/bin"

          # Ensure both binaries got picked up.
          if [ ! -f "$STAGE/bin/worktree.exe" ]; then
            echo "::error::missing Windows binary in merged stage"; exit 1
          fi
          if [ ! -f "$STAGE/bin/worktree" ]; then
            echo "::error::missing Linux binary in merged stage"; exit 1
          fi
          chmod +x "$STAGE/bin/worktree"

          ZIP="dist/agent-worktree-${{ inputs.version }}.zip"
          mkdir -p dist
          # Use Python's zipfile so we can stamp Unix mode bits into the
          # central directory — required so the Linux binary keeps its
          # exec bit after `unzip` on Linux/macOS.
          python3 - "$STAGE" "$ZIP" <<'PY'
          import os, sys, time, zipfile
          stage, zip_path = sys.argv[1], sys.argv[2]
          EXECS = {"bin/worktree", "bin/worktree.exe"}
          EXE_ATTR = (0o755 << 16) | 0x8000  # S_IFREG | 0755
          REG_ATTR = (0o644 << 16) | 0x8000
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for dirpath, dirnames, filenames in os.walk(stage):
                  dirnames.sort()
                  for name in sorted(filenames):
                      abs_path = os.path.join(dirpath, name)
                      rel = os.path.relpath(abs_path, stage).replace(os.sep, "/")
                      st = os.stat(abs_path)
                      mtime = time.localtime(st.st_mtime)[:6]
                      zi = zipfile.ZipInfo(filename=rel, date_time=mtime)
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      zi.create_system = 3  # Unix
                      zi.external_attr = EXE_ATTR if rel in EXECS else REG_ATTR
                      with open(abs_path, "rb") as fh:
                          zf.writestr(zi, fh.read())
          print(f"wrote {zip_path} ({os.path.getsize(zip_path)} bytes)")
          PY

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "asset=$ZIP"   >> "$GITHUB_OUTPUT"

      - name: Push orphan release branch and capture commit
        id: rel
        shell: bash
        env:
          TAG: ${{ needs.stamp.outputs.tag }}
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          ZIP="${{ steps.stage.outputs.asset }}"

          # Capture main's tip *before* `checkout --orphan` moves HEAD --
          # this is the commit the `src/<TAG>` marker tag points at, and the
          # commit notes generation (in the next step) treats as the tip of
          # real history for this release.
          MAIN_SHA=$(git rev-parse HEAD)
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"

          # Stash staging + zip + the scripts dir outside the worktree
          # before `checkout --orphan` wipes everything -- `.github/scripts`
          # is staged here for the later "Dispatch to agent-marketplace"
          # step, which runs *after* the orphan checkout has replaced this
          # job's working tree with the release branch's own (script-less)
          # contents.
          TMP=$(mktemp -d)
          mkdir -p "$RUNNER_TEMP/ci-scripts"
          cp -a .github/scripts/. "$RUNNER_TEMP/ci-scripts/"
                    # .gitattributes MUST ship on the orphan release branch: Claude Code clones it,
          # and on a Windows machine with core.autocrlf=true (Git-for-Windows default)
          # a checkout without `* text=auto eol=lf` writes CRLF into the plugin cache —
          # and Claude Code silently ignores CRLF skills/agents. (Rebuild incident 2026-08-23.)
          for ga in .gitattributes stamped/.gitattributes; do
            if [ -f "$ga" ]; then cp -a "$ga" "$STAGE/"; break; fi
          done
          cp -a "$STAGE"/. "$TMP/"
          ASSET_DIR=$(mktemp -d)
          cp "$ZIP" "$ASSET_DIR/"
          echo "asset=$ASSET_DIR/$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push the `src/<TAG>` marker unconditionally (no skip-if-exists
          # guard -- the `stamp` job's pre-flight already proved it's
          # absent) *before* the orphan push below. This push is only
          # accepted by the workflow-modification guard on a GITHUB_TOKEN
          # push because MAIN_SHA is main's own tip (proved by the
          # pre-flight's check (a)), so its .github/workflows/ tree is the
          # default branch's own tip tree.
          git push origin "${MAIN_SHA}:refs/tags/src/${TAG}"

          git checkout --orphan release
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true

          leftover=$(find . -mindepth 1 -maxdepth 1 -not -name '.git' || true)
          if [ -n "$leftover" ]; then
            echo "::error::working tree not empty after clean:"; echo "$leftover"; exit 1
          fi

          cp -a "$TMP"/. .

          echo "=== release branch contents ==="
          find . -mindepth 1 -not -path './.git*' | sort

          # Stamp +x on both binaries so a Linux clone of the orphan release
          # branch yields executable files (matters for WSL/Linux installs).
          git add bin/worktree.exe bin/worktree
          git update-index --chmod=+x bin/worktree.exe
          git update-index --chmod=+x bin/worktree
          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push origin release --force

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          TAG:      ${{ needs.stamp.outputs.tag }}
          PREV_TAG: ${{ needs.stamp.outputs.prev_tag }}
        run: |
          set -euo pipefail

          # The orphan `release` commit/tag has no merge-base with any prior
          # commit (it's a parentless orphan by design -- the ticket that
          # introduced it forbids changing that layout), so neither
          # `gh release create --generate-notes` nor `--notes-start-tag`
          # can work directly against it: both walk commit ancestry to find
          # "everything since the last release", and an orphan commit has
          # none. Instead, notes are generated against the parallel
          # `src/<TAG>` marker tag (pushed onto `main`'s real history, in
          # the previous step) and its predecessor `src/<PREV_TAG>` (empty
          # on a first-ever release, in which case `previous_tag_name` is
          # omitted entirely rather than passed empty) -- both of which DO
          # have real ancestry on `main` -- and the resulting notes are then
          # attached to the release created against the orphan commit via
          # `--notes-file`.
          NOTES_FILE=$(mktemp)
          trap 'rm -f "$NOTES_FILE"' EXIT
          gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="src/${TAG}" \
            -f target_commitish="${{ steps.rel.outputs.main_sha }}" \
            ${PREV_TAG:+-f previous_tag_name="src/${PREV_TAG}"} \
            --jq '.body' > "$NOTES_FILE"

          gh release create "$TAG" \
            --repo "$REPO" \
            --target "${{ steps.rel.outputs.sha }}" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            ${{ contains(inputs.version, '-') && '--prerelease' || '' }} \
            "${{ steps.rel.outputs.asset }}"

      # Tags created via GITHUB_TOKEN don't fire downstream push:tags workflows
      # (Actions blocks this to prevent recursive loops). Call the marketplace
      # directly with a separate PAT.
      #
      # Payload building is delegated to the shared
      # .github/scripts/marketplace-payload.sh (ticket #184) -- invoked via
      # `bash <path>`, never relying on the exec bit, and via the
      # $RUNNER_TEMP staging copy made before the orphan checkout wiped
      # `.github/scripts` out of this job's working tree (see the "Push
      # orphan release branch..." step above).
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_PAT:             ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          REPO:               ${{ github.repository }}
          VERSION:            ${{ inputs.version }}
          TAG:                ${{ needs.stamp.outputs.tag }}
          PLUGIN_JSON:        .claude-plugin/plugin.json
          MAX_CHANGELOG_LEN:  "30000"
          SCRIPTS:            ${{ runner.temp }}/ci-scripts
        run: |
          bash "$SCRIPTS/marketplace-payload.sh" | curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Seretos/agent-marketplace/dispatches \
            -d @-
