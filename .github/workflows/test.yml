name: tests

# Runs pytest ONLY on the pull request event -- never on a plain push to a
# branch. Branch protection on `main` (an out-of-band repo setting, not part
# of this workflow) is the sole gate for direct pushes; this keeps CI from
# running twice per commit while a branch has an open pull request. Distinct
# from release.yml, which is workflow_dispatch-driven and produces the
# OS-specific binaries / release zip.
#
# OS_TARGETS for agent-worktree: [windows, linux]. The test suite exercises
# real `git worktree` operations against the checked-out repo, which works
# identically on both platforms — no Win32 lock-in.
on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # Pre-bump CI wall-clock (lib-python-worktree < v0.3.11): 301s / 315s /
    # 397s / 406s across observed runs. After bumping the pin to v0.3.11,
    # the new orphan-scan overhead roughly doubles Windows wall-clock time:
    # the windows-latest leg was cancelled twice at ~10m17s against the old
    # 10-minute budget -- a cancellation, not a completion, so the true
    # post-bump duration is unknown but at least that long. Sized from a
    # ~2x-overhead reading of the 406s pre-bump worst case (~13.5 min) plus
    # margin; still tight enough to catch a genuinely wedged/hung job.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required (unlike sibling plugins) because the
          # test suite exercises real `git worktree` operations and needs
          # full history / refs.
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Configure git identity (for worktree tests)
        shell: bash
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name  "Worktree Tester"

      - name: Install plugin + test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        shell: bash
        run: python -m pytest
