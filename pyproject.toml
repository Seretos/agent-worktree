[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worktree_plugin"
version = "0.0.0"
description = "MCP server for git worktree lifecycle management. Create/list/remove worktrees with branch handling, run per-project setup scripts on creation, and detect uncommitted changes before destructive operations."
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "mcp>=1.2,<2",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "lib-python-worktree @ git+https://github.com/Seretos/lib-python-worktree@v0.3.14",
  "lib-python-config @ git+https://github.com/Seretos/lib-python-config@v0.1.1",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10",
]
test = [
  "pytest>=8",
  "pytest-timeout>=2.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# Ticket #105 (reframed by #181): bound every test at 60s so a wedged
# worktree_remove (or any other unexpectedly hung test) fails loudly instead
# of hanging the suite silently. This no longer guards against a
# load-dependent daemon-thread leak -- that framing (upstream
# Seretos/lib-python-worktree#90) was superseded once #181's v0.3.13 bump
# fixed the actual user-visible symptom, the Windows worktree_remove hang
# caused by an unconditional systemwide blocking-process handle scan (see
# tests/test_thread_leak_regression.py). On Windows a timeout hit aborts the
# whole session but dumps thread stacks first -- useful diagnostics for
# tracking down any future wedge.
timeout = 60
