[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worktree_plugin"
version = "0.0.0"
description = "MCP server for git worktree lifecycle management. Create/list/remove worktrees with branch handling, run per-project setup scripts on creation, and detect uncommitted changes before destructive operations."
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "mcp>=1.2,<2",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "lib-python-worktree @ git+https://github.com/Seretos/lib-python-worktree@v0.3.12",
  "lib-python-config @ git+https://github.com/Seretos/lib-python-config@v0.1.1",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10",
]
test = [
  "pytest>=8",
  "pytest-timeout>=2.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# Ticket #105: bound every test at 60s as a general anti-wedge backstop
# (defence-in-depth), independent of any single defect. The daemon-thread
# leak this comment used to justify the bound against (upstream
# Seretos/lib-python-worktree#90, tracked here as agent-worktree#111) was
# closed upstream by v0.3.12 (Seretos/lib-python-worktree#148, ticket #176);
# the timeout remains configured regardless, since a per-test wedge could in
# principle come from any cause. On Windows a timeout hit aborts the whole
# session but dumps thread stacks first.
timeout = 60
